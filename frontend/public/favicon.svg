<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Primary Theme Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="12" />
  
  <!-- Subtle Internal Glow/Highlight Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3" />

  <!-- Shield Shape Content -->
  <g transform="translate(0, 10)">
    <!-- Graduation Cap Motif -->
    <path d="M256 120 L390 180 L256 240 L122 180 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    <path d="M176 205 V255 C176 290, 336 290, 336 255 V205" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M360 190 V290 C360 300, 370 310, 380 310 C390 310, 400 300, 400 290 V190" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="380" cy="310" r="12" fill="url(#accentGrad)" />
    
    <!-- Code / Computer Screen Motif -->
    <rect x="146" y="270" width="220" height="130" rx="12" fill="none" stroke="url(#primaryGrad)" stroke-width="14" />
    <line x1="216" y1="400" x2="296" y2="400" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" />
    <line x1="256" y1="400" x2="256" y2="430" stroke="url(#primaryGrad)" stroke-width="14" />
    <line x1="216" y1="430" x2="296" y2="430" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Terminal Code Tag (Nested inside screen) -->
    <path d="M190 315 L170 335 L190 355" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M322 315 L342 335 L322 355" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="270" y1="310" x2="242" y2="360" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
